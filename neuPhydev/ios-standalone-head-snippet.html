<!-- Put these in <head>. The Go/WASM build also injects them at runtime,
     but static markup is the most reliable form for iOS Home Screen setup. -->
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Postgravity">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">

<!-- Optional: point this at your real square icon. -->
<!-- <link rel="apple-touch-icon" href="icon-180.png"> -->
