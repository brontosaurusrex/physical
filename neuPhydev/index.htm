<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Physical</title>

  <style>
    @font-face {
      font-family: "GameFont";
      src: url("font/EnvyCodeRNerdFontMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html,
    body,
    #gameShell,
    #gameShell * {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1a2e;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: GameFont, monospace;
    }

    #gameShell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      background: #16213e;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #16213e00;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #alwaysControls {
      position: absolute;
      top: 10px;
      right: 14px;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #alwaysControls button {
      width: 48px;
      min-width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.2);
      background: transparent;
      font: 700 34px/1 GameFont, monospace;
      display: grid;
      place-items: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #alwaysControls button:active {
      color: rgba(255, 255, 255, 0.98);
      background: rgba(10, 12, 25, 0.72);
    }

    #mobileControls {
      position: absolute;
      top: 66px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 21;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: nowrap;
      background: rgba(10, 12, 25, 0.9);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-6px);
      transition:
        opacity 120ms ease,
        transform 120ms ease,
        visibility 0s linear 120ms;
    }

    #mobileControls.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition:
        opacity 120ms ease,
        transform 120ms ease,
        visibility 0s;
    }

    #mobileControls button {
      width: 48px;
      min-width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.68);
      background: transparent;
      font: 700 34px GameFont, monospace;
      line-height: 1;
      display: grid;
      place-items: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #mobileControls button:active {
      color: rgba(255, 255, 255, 0.95);
    }

    #rotateOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: white;
      background: #1a1a2e;
      text-align: center;
      font: 700 20px/1.5 GameFont, monospace;
    }

    @media (orientation: portrait) {
      #gameShell { display: none; }
      #rotateOverlay { display: flex; }
    }


    #loadingTitle {
    position: absolute;
    inset: 0;
    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #f1faee;
    background: #16213e00;

    font: 700 18px/1 GameFont, monospace;
    letter-spacing: 2.0em; 
    
    text-transform: uppercase;
    transform: translateY(-3.40em) translateX(1.0em);

    pointer-events: none;
    opacity: 1;
    transition: opacity 1500ms ease;
    }


    #loadingTitle.is-hidden {
      opacity: 0;
    }

  </style>

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-GwXgYc1QcAQAI6eG4F1AG.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>


</head>

<body>
  <div id="gameShell">
    <canvas id="gameCanvas" width="1800" height="900"></canvas>

    <div id="loadingTitle">Physical</div>

    <div id="alwaysControls">
      <button id="pauseButton" type="button" aria-label="toggle pause">󰏤</button>
      <button id="fullscreenButton" type="button" aria-label="toggle fullscreen"></button>
      <button
        id="toolbarToggleButton"
        type="button"
        aria-label="show game controls"
        aria-expanded="false"
        aria-controls="mobileControls"
      >⋮</button>
    </div>

    <div id="mobileControls">
      <button id="previousLevelButton" type="button" aria-label="previous level"></button>
      <button id="nextLevelButton" type="button" aria-label="next level"></button>
      <button id="magnetsButton" type="button" aria-label="toggle magnets">󰍈</button>
      <button id="zapperButton" type="button" aria-label="Toggle zapper">⚡</button>
      <button id="soundButton" type="button" aria-label="toggle sound">󰕾</button>
      <button id="mobileControlModeButton" type="button" aria-label="choose mobile controls">◉</button>
    </div>
<!--
◉
󰠳
-->
  </div>

  <div id="rotateOverlay">
    Rotate your device to landscape mode to play.
  </div>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    console.log("Breakout build: pause-fixed-v2");

    const NATIVE_WIDTH = 1800;
    const NATIVE_HEIGHT = 900;
    const EDGE_GAP = 8;
    const TOOLBAR_HIDE_DELAY = 4000;

    function hideLoadingTitle() {
      const title = document.getElementById("loadingTitle");

      if (!title) {
        return;
      }

      title.classList.add("is-hidden");

      title.addEventListener(
        "transitionend",
        () => title.remove(),
        { once: true }
      );
    }

    function visibleViewportSize() {
      const viewport = window.visualViewport;
      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
      };
    }

    function fitGameToViewport() {
      const shell = document.getElementById("gameShell");
      const { width, height } = visibleViewportSize();

      const availableWidth = Math.max(1, width - EDGE_GAP * 2);
      const availableHeight = Math.max(1, height - EDGE_GAP * 2);

      const scale = Math.min(
        availableWidth / NATIVE_WIDTH,
        availableHeight / NATIVE_HEIGHT,
        1
      );

      shell.style.width = `${Math.floor(NATIVE_WIDTH * scale)}px`;
      shell.style.height = `${Math.floor(NATIVE_HEIGHT * scale)}px`;
    }

    fitGameToViewport();

    window.addEventListener("resize", fitGameToViewport);
    let pausedByRotateOverlay = false;

    function updateRotatePause() {
      const portrait = window.matchMedia("(orientation: portrait)").matches;

      if (
        portrait &&
        typeof window.breakoutSetPaused === "function" &&
        typeof window.breakoutIsPaused === "function"
      ) {
        if (!window.breakoutIsPaused()) {
          window.breakoutSetPaused(true);
          pausedByRotateOverlay = true;
        }
      } else if (
        !portrait &&
        pausedByRotateOverlay &&
        typeof window.breakoutSetPaused === "function"
      ) {
        window.breakoutSetPaused(false);
        pausedByRotateOverlay = false;
      }
    }

    window.addEventListener("orientationchange", () => {
      updateRotatePause();
      setTimeout(() => {
        updateRotatePause();
        fitGameToViewport();
      }, 150);
      setTimeout(() => {
        updateRotatePause();
        fitGameToViewport();
      }, 500);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fitGameToViewport);
      window.visualViewport.addEventListener("scroll", fitGameToViewport);
    }

    const toolbarToggleButton =
      document.getElementById("toolbarToggleButton");
    const mobileControls =
      document.getElementById("mobileControls");

    let toolbarHideTimer = null;

    function clearToolbarHideTimer() {
      if (toolbarHideTimer !== null) {
        clearTimeout(toolbarHideTimer);
        toolbarHideTimer = null;
      }
    }

    function hideToolbar() {
      clearToolbarHideTimer();
      mobileControls.classList.remove("is-open");
      toolbarToggleButton.setAttribute("aria-expanded", "false");
      toolbarToggleButton.setAttribute("aria-label", "show game controls");

    }

    function scheduleToolbarHide() {
      clearToolbarHideTimer();
      toolbarHideTimer = setTimeout(
        hideToolbar,
        TOOLBAR_HIDE_DELAY
      );
    }

    function showToolbar() {
      mobileControls.classList.add("is-open");
      toolbarToggleButton.setAttribute("aria-expanded", "true");
      toolbarToggleButton.setAttribute("aria-label", "hide game controls");
      scheduleToolbarHide();
    }

    function toggleToolbar() {
      if (mobileControls.classList.contains("is-open")) {
        hideToolbar();
      } else {
        showToolbar();
      }
    }

    toolbarToggleButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();
      toggleToolbar();
    });

    mobileControls.addEventListener("pointerdown", event => {
      event.stopPropagation();
      scheduleToolbarHide();
    });

    mobileControls.querySelectorAll("button").forEach(button => {
      button.addEventListener("pointerup", () => {
        const keepOpen =
          button.id === "previousLevelButton" ||
          button.id === "nextLevelButton";

        if (keepOpen) {
          scheduleToolbarHide();
        } else {
          setTimeout(hideToolbar, 120);
        }
      });
    });


    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (
        key === "n" &&
        typeof window.breakoutNextLevel === "function"
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.breakoutNextLevel();
      } else if (
        key === "p" &&
        typeof window.breakoutPreviousLevel === "function"
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.breakoutPreviousLevel();
      }
    }, true);

    // Keep the display awake only while phone-tilt controls are active.
    let screenWakeLock = null;
    let tiltModeActive = false;

    async function acquireScreenWakeLock() {
      if (
        !tiltModeActive ||
        document.visibilityState !== "visible" ||
        !("wakeLock" in navigator)
      ) {
        return;
      }

      if (screenWakeLock && !screenWakeLock.released) {
        return;
      }

      try {
        screenWakeLock = await navigator.wakeLock.request("screen");
        screenWakeLock.addEventListener("release", () => {
          screenWakeLock = null;
        });
      } catch (error) {
        console.warn("Screen wake lock request failed:", error);
        screenWakeLock = null;
      }
    }

    async function releaseScreenWakeLock() {
      if (!screenWakeLock) {
        return;
      }

      try {
        await screenWakeLock.release();
      } catch (error) {
        console.warn("Screen wake lock release failed:", error);
      }

      screenWakeLock = null;
    }

    window.breakoutSetTiltWakeLock = active => {
      tiltModeActive = Boolean(active);

      if (tiltModeActive) {
        acquireScreenWakeLock();
      } else {
        releaseScreenWakeLock();
      }
    };

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && tiltModeActive) {
        acquireScreenWakeLock();
      }
    });

    const fullscreenButton =
      document.getElementById("fullscreenButton");

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.error("Fullscreen request failed:", error);
      }
    }

    fullscreenButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();
      toggleFullscreen();
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.setAttribute(
        "aria-label",
        document.fullscreenElement
          ? "exit fullscreen"
          : "toggle fullscreen"
      );

      setTimeout(fitGameToViewport, 50);
      setTimeout(fitGameToViewport, 250);
    });

    async function loadGame() {
      const response = await fetch("physical.wasm");

      if (!response.ok) {
        throw new Error(
          `Failed to load WASM: ${response.status} ${response.statusText}`
        );
      }

      const result = await WebAssembly.instantiateStreaming(
        response,
        go.importObject
      );

      await document.fonts.load("700 18px GameFont");
      await document.fonts.ready;

      fitGameToViewport();
      go.run(result.instance);
      hideLoadingTitle();

      let rotatePauseAttempts = 0;
      const rotatePauseTimer = setInterval(() => {
        rotatePauseAttempts++;

        if (typeof window.breakoutSetPaused === "function") {
          clearInterval(rotatePauseTimer);
          updateRotatePause();
        } else if (rotatePauseAttempts >= 100) {
          clearInterval(rotatePauseTimer);
        }
      }, 50);
    }

    loadGame().catch(console.error);
  </script>
</body>
</html>
