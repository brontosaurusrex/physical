<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Breakout with Spin</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; }
    canvas { background: #16213e; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1800" height="900"></canvas>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then((result) => go.run(result.instance))
      .catch((err) => console.error(err));
  </script>
</body>
</html>
