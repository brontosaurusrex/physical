<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Physical</title>

  <style>
    @font-face {
      font-family: "GameFont";
      src: url("font/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1a2e;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: GameFont, monospace;
    }

    #gameShell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      background: #16213e;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #16213e;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #mobileControls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    #mobileControls button {
      width: auto;
      min-width: 44px;
      height: 34px;
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 7px;
      color: white;
      background: rgba(10, 10, 20, 0.68);
      font: 700 11px GameFont, monospace;
      line-height: 1;
      touch-action: manipulation;
    }

    #rotateOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: white;
      background: #1a1a2e;
      text-align: center;
      font: 700 20px/1.5 GameFont, monospace;
    }

    @media (orientation: portrait) {
      #gameShell {
        display: none;
      }

      #rotateOverlay {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div id="gameShell">
    <canvas id="gameCanvas" width="1800" height="900"></canvas>

    <div id="mobileControls">
      <button id="pauseButton" type="button">Pause</button>
      <button id="soundButton" type="button">Sound</button>
    </div>
  </div>

  <div id="rotateOverlay">
    Rotate your device to landscape mode to play.
  </div>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();

    const NATIVE_WIDTH = 1800;
    const NATIVE_HEIGHT = 900;
    const EDGE_GAP = 8;

    function visibleViewportSize() {
      const viewport = window.visualViewport;

      return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
      };
    }

    function fitGameToViewport() {
      const shell = document.getElementById("gameShell");
      const { width, height } = visibleViewportSize();

      const availableWidth = Math.max(1, width - EDGE_GAP * 2);
      const availableHeight = Math.max(1, height - EDGE_GAP * 2);

      const scale = Math.min(
        availableWidth / NATIVE_WIDTH,
        availableHeight / NATIVE_HEIGHT,
        1
      );

      shell.style.width = `${Math.floor(NATIVE_WIDTH * scale)}px`;
      shell.style.height = `${Math.floor(NATIVE_HEIGHT * scale)}px`;
    }

    fitGameToViewport();

    window.addEventListener("resize", fitGameToViewport);
    window.addEventListener("orientationchange", () => {
      setTimeout(fitGameToViewport, 150);
      setTimeout(fitGameToViewport, 500);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fitGameToViewport);
      window.visualViewport.addEventListener("scroll", fitGameToViewport);
    }

    async function loadGame() {
      const response = await fetch("main_unbrk2.wasm");

      if (!response.ok) {
        throw new Error(
          `Failed to load WASM: ${response.status} ${response.statusText}`
        );
      }

      const result = await WebAssembly.instantiateStreaming(
        response,
        go.importObject
      );

      await document.fonts.load("700 18px GameFont");
      await document.fonts.ready;

      fitGameToViewport();
      go.run(result.instance);
    }

    loadGame().catch(console.error);
  </script>
</body>
</html>
