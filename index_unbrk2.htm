<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <title>Breakout with Spin</title>

  <style>
    @font-face {
      font-family: "GameFont";
      src: url("font/SpaceMono-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: GameFont, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1a2e;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #gameShell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: min(1800px, 100vw);
      height: auto;
      max-height: 100vh;
      object-fit: contain;
      background: #16213e;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    #mobileControls {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    #mobileControls button {
      min-width: 56px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      color: white;
      background: rgba(10, 10, 20, 0.72);
      font: 700 14px GameFont, monospace;
      touch-action: manipulation;
    }

    #rotateOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: white;
      background: #1a1a2e;
      text-align: center;
      font: 700 20px/1.5 GameFont, monospace;
    }

    @media (orientation: portrait) {
      #gameShell,
      #mobileControls {
        display: none;
      }

      #rotateOverlay {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div id="gameShell">
    <canvas id="gameCanvas" width="1800" height="900"></canvas>
  </div>

  <div id="mobileControls">
    <button id="pauseButton" type="button">Pause</button>
    <button id="soundButton" type="button">Sound</button>
  </div>

  <div id="rotateOverlay">
    Rotate your device to landscape mode to play.
  </div>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();

    async function loadGame() {
      const response = await fetch("main_unbrk2.wasm");
      if (!response.ok) {
        throw new Error(
          `Failed to load WASM: ${response.status} ${response.statusText}`
        );
      }

      const result = await WebAssembly.instantiateStreaming(
        response,
        go.importObject
      );

      await document.fonts.load("700 18px GameFont");
      await document.fonts.ready;
      go.run(result.instance);
    }

    loadGame().catch(console.error);

    async function requestLandscape() {
      try {
        if (
          screen.orientation &&
          screen.orientation.lock &&
          window.matchMedia("(orientation: landscape)").matches
        ) {
          await screen.orientation.lock("landscape");
        }
      } catch (_) {
        // Orientation locking usually requires fullscreen or an installed PWA.
        // The portrait overlay remains the reliable fallback.
      }
    }

    document.addEventListener("pointerdown", requestLandscape, { once: true });
  </script>
</body>
</html>
